<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="main">
        <div class="cart">
            <div class="cart-item">
                <div class="logo-cart">
                    <div class="icon-code"><i class="fa-solid fa-code"></i></div>
                    <span>Bán chạy</span>
                </div>
                <div class="content-cart">
                    <div class="subject">
                        <span>Lập trình</span>
                        <div class="evaluate">
                            <i class="fa-solid fa-star"></i>
                            <span class="star">
                                4.9
                            </span>
                        </div>
                    </div>
                    <div class="title-cart">
                        Lập trình Web Full Stack
                    </div>
                    <div class="text-cart">
                        Học lập trình web từ cơ bản đến nâng cao với các công
                        nghệ hiện đại nhất
                    </div>
                    <div class="status">
                        <span><i class="fa-solid fa-clock"></i> 40 giờ</span>
                        <span><i class="fa-solid fa-users"></i> 12K+ học viên</span>
                    </div>
                </div>
                <div class="footer-cart">
                    <div class="content-foot-cart">
                        <p class="price">2.990.000đ</p>
                        <button>Xem chi tiết</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
