<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Đăng ký sinh viên mới</h1>
    </header>
    <main>
        <form action="">
            <div>
                <label for="">
                    Họ và tên: 
                </label>
                <input type="text" name="" id="name" placeholder="Họ và tên" value="Hoàng Văn Sơn">
            </div>
            <br>
            <div>
                <label for="">
                    Ngày sinh đầy đủ:
                </label>
                <input type="date" name="" id="name" placeholder="Họ và tên">
            </div>
            <br>
            <div>
                <label for="">
                    Tháng và năm nhập học:
                </label>
                <input type="month" name="" id="name" >
            </div>
            <br>
            <div>
                <label for="">
                    Thời gian học:
                </label>
                <input type="time" name="" id="name">
            </div>
            <br>
            <div>
                <label for="">
                    Giới tính:
                </label>
                <input type="radio" name="sex" id="nam" >
                <label for="nam">Nam</label>
                <input type="radio" name="sex" id="nu">
                <label for="nu">Nữ</label>
            </div>
            <br>
            <div>
                <label for="email">
                    Email sinh viên:
                </label>
                <input type="email" name="" id="email" placeholder="sinhvien@university.edu.vn">
            </div>
            <br>
            <div>
                <label for="password">
                    Mật khẩu:
                </label>
                <input type="password" name="" id="password" placeholder="sinhvien@university.edu.vn">
            </div>
            <br>
            <div>
                <label for="textarea">
                    Mục tiêu học tập:
                </label>
                <textarea name="textarea" id="textarea" style="height: 70px; width: 200px;" placeholder="Muốn trở thành lập trình viên giỏi và đogs góp cho xã hội"></textarea>
            </div>
            <br>
            <div>
                <label for="address">
                    Mật khẩu:
                </label>
                <select name="address" id="address">
                    <option value="hanoi">Hà Nội </option>
                    <option value="hochiminh">Hồ Chí Minh</option>
                    <option value="danang">Đà Nẵng</option>
                </select>
            </div>
            <br>
            <div>
                <label for="file">
                    Ảnh thẻ sinh viên:
                </label>
                <input type="file" name="" id="file" value="file">
            </div>
            <br>
            <div>
                <label for="">
                    Môn học yêu thích:
                </label>
                <input type="checkbox" name="monhoc" id="toan" checked>
                <label for="toan">Toán</label>
                <input type="checkbox" name="monhoc" id="lap-trinh" checked>
                <label for="lap-trinh">Lập Trình</label>
                <input type="checkbox" name="monhoc" id="tieng-anh">
                <label for="tieng-anh">Tiếng Anh</label>
                <input type="checkbox" name="monhoc" id="vat-ly">
                <label for="vat-ly">Vật Lý</label>
            </div>
            <br>
            <div>
                <label for="file">
                    Tiến độ học tập:
                </label>
                <input type="range" name="" id="range" value="range" min="0" max="100">
            </div>
            <br>
            <label for="year">Năm học thứ</label>
            <input type="number" id="year" name="year" value="2" min="1" max="5">
            <br><br>
            
            <label for="search">Tìm kiếm khóa học</label>
            <input type="search" id="search" name="search" value="Khoa học máy tính">
            <br><br>
            
            <label for="color">Màu sắc yêu thích</label>
            <input type="color" id="color" name="color">
            <br><br>
            
            <button type="reset">Hủy</button>
            <button type="reset">Làm mới</button>
            <button type="submit">Gửi</button>
        </form>
    </main>
</body>
</html>
