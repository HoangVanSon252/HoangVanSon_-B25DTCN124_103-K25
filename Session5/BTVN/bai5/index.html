<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <main>
        <h2>Ý Kiến Phản Hồi tới Nha Sỹ</h2>
        <form action="">
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" placeholder="Nhập họ và tên">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Nhập email của bạn">
            <label for="comment">Phản hồi của bạn:</label>
            <textarea name="" id="comment" placeholder="Nhập ý kiến của bạn..." ></textarea>
            <input type="submit" value="Gửi ý kiến">
        </form>
    </main>
</body>
</html>
