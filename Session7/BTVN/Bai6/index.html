<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Giao diện Nha Khoa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <main>
        <div class="card">
            <div class="header-card">
                <span class="title-card">
                    Niềng răng chỉnh nha
                </span>
                <span class="status">ĐANG ĐIỀU TRỊ</span>
            </div>
            <div class="content-card">
                <div class="information">
                    <p><span>Bác sĩ</span> <i class="fa-solid fa-user"></i> : <strong>BS. Nguyễn Minh Tâm</strong></p>
                    <p><span>Chi phí</span> <i class="fa-solid fa-calculator"></i> : <strong>25.000.000</strong></p>
                </div>
                <div class="process">
                    <span>Tiến trình điều trị</span>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="date-card">
                        <span>Bắt đầu: 10/03/2025</span>
                        <span>Dự kiến hoàn thành: 10/03/2026</span>
                    </div>
                </div>
            </div>
            
        </div>
    </main>
</body>

</html>
