<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>Quản Lý Nhân Viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Quản Lý Nhân Viên</h1>
    </header>

    <section class="form-section">
      <form id="form-employee">
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Họ và tên <span class="required">*</span></label>
            <input type="text" id="fullName" name="fullName" placeholder="Nhập họ và tên" required />
            <span id="errol-fullname"></span>
          </div>

          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="vd: ten@gmail.com" required />
            <span id="errol-email"></span>
          </div>

          <div class="form-group">
            <label for="dateOfBirth">Ngày sinh <span class="required">*</span></label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" required />
            <span id="errol-dateOfBirth"></span>
          </div>

          <div class="form-group">
            <label for="position">Chức vụ <span class="required">*</span></label>
            <select id="position" name="position" required>
              <option value="">-- Chọn chức vụ --</option>
              <option value="Nhân viên">Nhân viên</option>
              <option value="Trưởng nhóm">Trưởng nhóm</option>
              <option value="Trưởng phòng">Trưởng phòng</option>
              <option value="Giám đốc">Giám đốc</option>
            </select>
            <span id="errol-position"></span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            Thêm Nhân Viên
          </button>
          <button type="reset" class="btn btn-secondary">Nhập Lại</button>
        </div>
      </form>
    </section>

    <section class="table-section">
      <div class="table-header">
        <h2>Danh Sách Nhân Viên</h2>
        <span class="badge">3 nhân viên</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Họ và tên</th>
              <th>Email</th>
              <th>Ngày sinh</th>
              <th>Chức vụ</th>
              <th>Thực hiện</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span>Tổng số nhân viên: 3</span>
    </footer>
    <script src="script.js"></script>
  </div>
</body>

</html>
