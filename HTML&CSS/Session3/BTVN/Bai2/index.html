<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Form Đặt Mua Tài Liệu Lập Trình</h1>
    </header>
    <main>
        <form action="">
            <div>
                <lable for="divice">
                    Chọn tài liệu:
                </lable>
                <select name="" id="divice">
                    <option value="tuvanhoctap">Tài liệu môn HTML&CSS</option>
                    <option value="huongnghiep">Tài liệu môn JavaScrip</option>
                </select>
            </div>
            <br />
            <div>
                <lable for="quantity">
                    Số lượng:
                </lable>
                <input type="number" value ="1" min="1" max="100" name ="number" id="quantity">
            </div>
            <br />
            <div>
                <lable for="note">
                    Ghi chú:
                </lable>
                <textarea name="note" id="note"></textarea>
            </div>
            <br />
            <div>
                <lable for="address">
                    Đia chỉ giao hàng:
                </lable>
                <textarea name="address" id="address"></textarea>
            </div>
            <br />
            <button>Đặt mua</button>
        </form>
    </main>
</body>
</html>
