<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Form Đắt Lịch Tư vấn Học Tập</h1>
    </header>
    <main>
        <form>
            <div>
                <lable>
                    Họ và tên:
                </lable>
                <input type="text" placeholder="Nhập họ và tên">
            </div>
            <br/>
            <div>
                <lable>
                    Chọn ngày giờ:
                </lable>
                <input type="datetime-local" placeholder="Nhập họ và tên">
            </div>
            <br />
            <div>
                <lable for="divice">
                    Loại dịch vụ:
                </lable>
                <select name="" id="divice">
                    <option value="tuvanhoctap">Tư vấn học tập</option>
                    <option value="huongnghiep">Hướng nghiệp</option>
                </select>
            </div>
            <br />
            <div>
                <lable for="divice">
                    Ghi chú:
                </lable>
                <textarea name="" id=""></textarea>
            </div>
            <br />
            <button>Đặt lịch</button>
        </form>
    </main>
</body>
</html>
