<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
        <main class="container">
            <div class="cart shadow p-4 rounded-2 mt-5">
                <form action="">
                    <h1 class="text-center fw-bold text-uppercase">
                        Đăng nhập
                    </h1>
                    <p class="text-center text-muted">Đăng nhập để sử dụng hệ thông e-learning</p>
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary">Email</label>
                        <input type="text" name="email" id="email" class="form-control p-2" placeholder="Nhập địa chỉ email">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary">Mật khẩu</label>
                        <input type="text" name="email" id="email" class="form-control p-2" placeholder="Nhập mật khẩu">
                    </div>
                    <div class="d-flex justify-content-between">
                        <div class="">
                            <input type="checkbox" name="check" id="check">
                            <label for="check">Ghi nhớ đăng nhập</label>
                        </div>
                        <div class="">
                            <a href="#" class="text-decoration-none">Quên mật khẩu?</a>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4">Đăng nhập</button>
                    <div class="text-center mt-4">
                        <span class="text-muted me-1">Chưa có tài khoản?</span>
                        <a href="" class="text-decoration-none">Đăng ký ngay</a>
                    </div>
                </form>
            </div>
        </main>
</body>
</html>
