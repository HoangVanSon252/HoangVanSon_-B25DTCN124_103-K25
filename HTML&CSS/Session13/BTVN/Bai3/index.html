<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <main class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Đăng ký</h2>
                    <p class="text-muted">Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>
                </div>
                <form action="">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="ho-dem" class="form-label text-secondary">Họ và tên đệm</label>
                            <input type="text" id="ho-dem" class="form-control p-2" placeholder="Nguyễn Văn">
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                             <label for="ten" class="form-label text-secondary">Tên đầy đủ
                            </label>
                            <input type="text" id="ten" class="form-control p-2" placeholder="An">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label text-secondary">Số điện thoại</label>
                        <input type="tel" id="phone" class="form-control p-2" placeholder="0912 345 678">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary">Email</label>
                        <input type="email" id="email" class="form-control p-2" placeholder="Nhập địa chỉ email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary">Mật khẩu</label>
                        <input type="password" id="password" class="form-control p-2" placeholder="Nhập mật khẩu">
                    </div>
                    <div class="mb-4">
                        <label for="re-password" class="form-label text-secondary">Nhập lại mật khẩu</label>
                        <input type="password" id="re-password" class="form-control p-2"
                            placeholder="Nhập lại mật khẩu">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Đăng ký</button>
                    <div class="text-center mt-4">
                        <span class="text-muted">Đã có tài khoản?</span>
                        <a href="#" class="text-decoration-none text-primary fw-semibold">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
